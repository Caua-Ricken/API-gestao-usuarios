services:
  mysql:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"

    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"

    volumes:
      - mysql_dados:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build: .

    environment:
      PORT: "3000"
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}"

    ports:
      - "127.0.0.1:${PORT}:3000"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_dados: